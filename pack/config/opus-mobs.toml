#Vaskars Opus - every mob, one section each. The defaults are the numbers the mod is made with.
#Kept with each world (serverconfig/); put a copy in defaultconfigs/ for every new world. A server sends
#it to whoever joins. In game: Mods > Vaskars Opus > Config.
#
#  spawning  false: no new ones come into the world - not by themselves, not in their places or parties,
#            not from eggs or /summon. Turning off a person a story or task needs (a ruler, Dorn, Elster,
#            Nal, the informant, Master Voss) leaves that story without them.
#  health    their full health in half-hearts.
#  damage    the weight of their blows: everything they do - weapons, arrows, spells, a great beast's
#            attacks - is scaled by this over the default.
#  armor     armor points; for people on top of what they wear.
#  speed     how fast they walk (the game's movement speed: a zombie has 0.23).
#  weight, minGroup, maxGroup, biomes   for the animals that come of themselves: how often, how many and where.
#
#Health, armor and speed are laid on whenever a mob comes into the world, so a change reaches the ones
#already there the next time they are loaded. Spawn weights take effect when the world is next opened.
[global]
	#Every Opus mob's health is multiplied by this, on top of its own setting.
	#Range: 0.05 ~ 20.0
	healthMultiplier = 1.0
	#Every Opus mob's damage is multiplied by this, on top of its own setting.
	#Range: 0.0 ~ 20.0
	damageMultiplier = 1.0

#The wild wargs that hunt at night under the open sky, and the ones the orcs ride.
[warg]
	#Whether new ones come into the world.
	spawning = true
	#Full health, in half-hearts.
	#Range: 1.0 ~ 4096.0
	health = 40.0
	#The weight of their blows; everything they do is scaled by it over the default.
	#Range: 0.0 ~ 1024.0
	damage = 7.0
	#Armor points.
	#Range: 0.0 ~ 30.0
	armor = 2.0
	#How fast they walk (a zombie has 0.23).
	#Range: 0.01 ~ 2.0
	speed = 0.32
	#How often wild wargs come against the other night monsters (a zombie has 100). 0 for never.
	#Range: 0 ~ 1000
	weight = 12
	#Smallest pack.
	#Range: 1 ~ 16
	minGroup = 1
	#Largest pack (never below minGroup).
	#Range: 1 ~ 16
	maxGroup = 3

#Master Brann. The great beasts are set in the Bestiary's config now.
