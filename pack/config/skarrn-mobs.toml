#Vaskars Bestiary - every creature, one section each. The defaults are the numbers the mod is made with.
#Kept with each world (serverconfig/); put a copy in defaultconfigs/ for every new world. A server sends
#it to whoever joins. In game: Mods > Vaskars Bestiary > Config.
#
#  spawning  false: no new ones come into the world - not in their clearings and lairs, not again after one
#            is killed, not from eggs or /summon.
#  health    their full health in half-hearts.
#  damage    the weight of their blows: everything they do is scaled by this over the default.
#  armor     armor points.
#  speed     how fast they walk (the game's movement speed: a zombie has 0.23).
#  weight, minGroup, maxGroup, biomes   for the ones that come of themselves: how often, how many and where.
#            These take effect when the world is next opened.
#
#The Skarrn's health_multiplier and damage_multiplier in skarrn-common.toml still count, on top of this.
[global]
	#Every creature's health is multiplied by this, on top of its own setting.
	#Range: 0.05 ~ 20.0
	healthMultiplier = 1.0
	#Every creature's damage is multiplied by this, on top of its own setting.
	#Range: 0.0 ~ 20.0
	damageMultiplier = 1.0

#The lightning stag of the burnt clearings.
[stag]

	[stag.skarrn]
		#Whether new ones come into the world.
		spawning = true
		#Full health, in half-hearts.
		#Range: 1.0 ~ 4096.0
		health = 288.0
		#The weight of their blows; everything they do is scaled by it over the default.
		#Range: 0.0 ~ 1024.0
		damage = 14.0
		#Armor points.
		#Range: 0.0 ~ 30.0
		armor = 8.0
		#How fast they walk (a zombie has 0.23).
		#Range: 0.01 ~ 2.0
		speed = 0.22

